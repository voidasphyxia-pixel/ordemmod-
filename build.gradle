plugins {
    // Minecraft 26.1+ nao e ofuscado: usa-se o plugin novo, SEM remapeamento.
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.archives_base_name
}

repositories {
    // Quando for portar as entidades (Zumbi de Sangue etc.), entra o GeckoLib 5.x para a 26.2:
    //   maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Sem 'mappings' e sem 'modImplementation': na 26.x vale 'implementation' normal.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// ---------------------------------------------------------------------------------------
// PORTE EM ETAPAS: so compila o que ja foi portado. Os demais arquivos continuam no repo,
// ainda em Forge, e voltam para esta lista conforme forem portados. Veja PORTE-FABRIC.md.
//   Etapa 2: nucleo em Java puro.
//   Etapa 3: rede (pacotes + registro) e salvamento. ReceptoresServidor, ReceptoresCliente e
//            marcado/ReceptorMarcado ja estao escritos mas FICAM DE FORA ate suas dependencias
//            (EventosOrdem, telas, HUD) serem portadas.
// ---------------------------------------------------------------------------------------
def nucleo = [
    'Atributo', 'Atributos', 'ClasseOP', 'GrauTreinamento', 'ParteBonus', 'Proficiencia',
    'TipoDano', 'TipoHabilidade', 'Pericia', 'NivelExposicao', 'ResultadoTeste', 'Trilha',
    'Pericias', 'Origem', 'Beneficio', 'PontosEsforco',
    'EfeitoDano', 'EfeitoDefesa', 'EfeitoAoUsar', 'EfeitoPassivo', 'EfeitosAtivos', 'EfeitosAtributos',
    'Habilidade', 'HabilidadesDoPersonagem', 'CatalogoHabilidades', 'Personagem',
    // etapa 3
    'CodecsOrdem', 'Rede', 'AnexosOrdem', 'SalvamentoOrdem',
    'PacoteHabilidade', 'PacoteAbrirCriacao', 'PacoteAviso', 'PacoteStatus', 'PacoteRolarPericia',
    'PacoteTeste', 'PacoteRolagemHud', 'PacoteCriarPersonagem', 'PacoteArvore', 'PacoteFicha',
    'marcado/PacoteMarcado',
    'OrdemMod'
]
sourceSets.main.java.include nucleo.collect { "com/exemplo/ordemmod/${it}.java" }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    // O descritor do Forge nao serve mais.
    exclude 'META-INF/mods.toml'
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    // Minecraft 26.1+ roda em Java 25.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
