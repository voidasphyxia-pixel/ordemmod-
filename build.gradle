plugins {
    // Minecraft 26.1+ nao e ofuscado: usa-se o plugin novo, SEM remapeamento.
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.archives_base_name
}

repositories {
    // GeckoLib 5.x (entidades animadas, etapa 5). So o grupo com.geckolib vem deste repositorio.
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroupAndSubgroups('com.geckolib') }
    }
    // Forge Config API Port (o TACZ 26.2 exige forgeconfigapiport >= 26.2.1). So o grupo
    // fuzs.forgeconfigapiport vem deste repositorio (maven oficial do autor, no GitHub).
    exclusiveContent {
        forRepository {
            maven {
                name = 'FuzsModResources'
                url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
            }
        }
        filter { includeGroupAndSubgroups('fuzs.forgeconfigapiport') }
    }
}

// TACZ (armas de fogo), versao Fabric 26.2: qualquer jar libs/TACZ-Refabricated*.jar (o nome exato nao importa).
// Os jars antigos do Forge (libs/tacz-1_20_1-...) nao casam com este padrao.
def taczJars = fileTree(dir: 'libs', include: 'TACZ-Refabricated*.jar')

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Sem 'mappings' e sem 'modImplementation': na 26.x vale 'implementation' normal.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // GeckoLib 5 (usado a partir da etapa 5b: entidade animada do Zumbi de Sangue).
    implementation "com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
    // TACZ: traz jars proprios dentro (bcel, luaj, commons-math3...), que o Fabric Loader carrega sozinho.
    // Nenhum codigo do mod chama a API dele ainda: as balas entram na logica de dano/pericias pelo mixin
    // em LivingEntity (veja PORTE-TACZ.md).
    implementation taczJars
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_api_port_version}"
}

if (taczJars.files.isEmpty()) {
    logger.warn("AVISO: nenhum libs/TACZ-Refabricated*.jar encontrado. Copie o jar do TACZ para a pasta libs/ "
            + "(confira com 'dir libs' se o nome nao ficou com .jar.jar). Veja PORTE-TACZ.md.")
} else {
    logger.lifecycle("TACZ: usando " + taczJars.files.collect { it.name }.join(', '))
}

// ---------------------------------------------------------------------------------------
// PORTE EM ETAPAS: so compila o que ja foi portado. Os demais arquivos continuam no repo,
// ainda em Forge, e voltam para esta lista conforme forem portados. Veja PORTE-FABRIC.md.
//   Etapa 2: nucleo em Java puro.
//   Etapa 3: rede (pacotes + registro) e salvamento.
//   Etapa 4a: ciclo de vida do personagem (EventosOrdem), Avisos, TesteNaTela, PerfilMarcado,
//            ReceptoresServidor e um entrypoint de cliente PROVISORIO (so para testar a rede).
//            Ainda fora: ReceptoresCliente (depende de HUD/telas).
//   Etapa 4b: EventosDano (dano, efeitos, sono, estado mental) + mixin/LivingEntityMixin.
//   Etapa 4d: EventosPericias, EventosOrigens, ReceptorMarcado (+ RoteiroMarcado), RolagemNaHud,
//            QuedaAcrobacia, EsquivaReflexos, EsquivaVisual (provisorio, no lugar do Epic Fight)
//            e os mixins MobMixin, PlayerMixin e TamableAnimalMixin.
//   Etapa 5a: SonsOrdem (registro direto, sem GeckoLib).
//   Etapa 5b: Zumbi de Sangue (EntidadesOrdem, ZumbiSangueEntity, ZumbiSangueAtaqueGoal) e o cliente dele
//            (ClienteEntidades, ZumbiSangueRenderer). ZumbiSangueModel.java ficou obsoleto (o renderer cria
//            o modelo sozinho) e NAO entra aqui.
//   Etapa 5c: ItensOrdem (ovo de spawn do Zumbi de Sangue).
//   Etapa 6a: cliente de verdade: FonteOP, TeclasOrdem, AvisoOrdem, RolagemHud, HudOrdem (HUD com HudElementRegistry),
//            ReceptoresCliente e o entrypoint OrdemModClienteFabric. ClienteCriacao/ClienteFicha/ClienteTeste entram
//            como PROVISORIOS (so escrevem no log); as telas (TelaCriacao, TelaFicha, TelaTeste, TelaMarcado,
//            titulo/*) ficam para a 6b em diante.
//   Etapa 6b: TelaTeste (o dado) e TelaFicha (menu K) com DesenhoOP (poligono/linha/halo), IconesOP, DescricoesOP e
//            marcado/VfxMarcado; ClienteFicha e ClienteTeste passam a abrir as telas de verdade. Ainda provisorio:
//            ClienteCriacao. InventarioOrdem (o inventario em vidro escuro) fica de fora: usava um evento do Forge.
//   Etapa 6c: TelaCriacao (criacao de personagem); ClienteCriacao abre ela direto (a cena do Marcado e a 6d).
//   Etapa 6d: cena do Marcado (TelaMarcado, AudioMarcado); ClienteCriacao volta a abrir a TelaMarcado quando comMarcado.
//            marcado/EventosMarcado.java ficou OBSOLETO e fora do build (o attachment do perfil ja e copyOnDeath).
//   Etapa 6e: tela inicial (titulo/TelaInicial, TemaInicial, EventosTitulo). titulo/EstiloMenu e EstiloTexturas (visual das
//            telas do jogo: fundo, botoes de vidro) ficam FORA: dependem de eventos do Forge e de texturas widgets.png que
//            nao existem mais no 26.x (veja PORTE-FABRIC.md, "6e2").
//   Etapa 7a: dependencia do TACZ (so build + fabric.mod.json, sem codigo novo).
// ---------------------------------------------------------------------------------------
def nucleo = [
    'Atributo', 'Atributos', 'ClasseOP', 'GrauTreinamento', 'ParteBonus', 'Proficiencia',
    'TipoDano', 'TipoHabilidade', 'Pericia', 'NivelExposicao', 'ResultadoTeste', 'Trilha',
    'Pericias', 'Origem', 'Beneficio', 'PontosEsforco',
    'EfeitoDano', 'EfeitoDefesa', 'EfeitoAoUsar', 'EfeitoPassivo', 'EfeitosAtivos', 'EfeitosAtributos',
    'Habilidade', 'HabilidadesDoPersonagem', 'CatalogoHabilidades', 'Personagem', 'CriacaoPersonagem',
    // etapa 3
    'CodecsOrdem', 'Rede', 'AnexosOrdem', 'SalvamentoOrdem',
    'PacoteHabilidade', 'PacoteAbrirCriacao', 'PacoteAviso', 'PacoteStatus', 'PacoteRolarPericia',
    'PacoteTeste', 'PacoteRolagemHud', 'PacoteCriarPersonagem', 'PacoteArvore', 'PacoteFicha',
    'marcado/PacoteMarcado',
    // etapa 4a
    'Avisos', 'TesteNaTela', 'EventosOrdem', 'ReceptoresServidor', 'marcado/PerfilMarcado',
    'cliente/OrdemModClienteFabric',
    // etapa 4b
    'EventosDano', 'mixin/LivingEntityMixin',
    // etapa 4d
    'EventosPericias', 'EventosOrigens', 'RolagemNaHud', 'QuedaAcrobacia', 'EsquivaReflexos', 'EsquivaVisual',
    'marcado/RoteiroMarcado', 'marcado/ReceptorMarcado',
    'mixin/MobMixin', 'mixin/PlayerMixin', 'mixin/TamableAnimalMixin',
    // etapa 5a
    'SonsOrdem',
    // etapa 5b
    'entidade/EntidadesOrdem', 'entidade/ZumbiSangueEntity', 'entidade/ZumbiSangueAtaqueGoal',
    'cliente/ClienteEntidades', 'cliente/ZumbiSangueRenderer',
    // etapa 5c
    'ItensOrdem',
    // etapa 6a
    'FonteOP', 'TeclasOrdem', 'AvisoOrdem', 'RolagemHud', 'HudOrdem',
    'ReceptoresCliente', 'ClienteCriacao', 'ClienteFicha', 'ClienteTeste',
    // etapa 6b: tela do dado e ficha (+ DesenhoOP, IconesOP, DescricoesOP e o VfxMarcado do fundo)
    'DesenhoOP', 'IconesOP', 'DescricoesOP', 'marcado/VfxMarcado', 'TelaTeste', 'TelaFicha',
    // etapa 6c: tela de criacao de personagem
    'TelaCriacao',
    // etapa 6d: cena do Marcado
    'marcado/AudioMarcado', 'marcado/TelaMarcado',
    'titulo/TelaInicial', 'titulo/TemaInicial', 'titulo/EventosTitulo',
    'OrdemMod'
]
sourceSets.main.java.include nucleo.collect { "com/exemplo/ordemmod/${it}.java" }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    // O descritor do Forge nao serve mais.
    exclude 'META-INF/mods.toml'
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    // Minecraft 26.1+ roda em Java 25.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
