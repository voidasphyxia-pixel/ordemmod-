# Memoria do Gradle (a 26.x nao precisa mais de remapeamento, entao e mais leve que no Forge).
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

## Versoes (Minecraft 26.2 + Fabric)
# Fabric Loader 0.19.5 ou mais novo (o modpack exige: Arrow In The Knee, Architectury e Sway); Fabric API da 26.2 (a mesma do seu modpack: 0.161.0+26.2).
minecraft_version=26.2
loader_version=0.19.5
fabric_api_version=0.161.0+26.2
# GeckoLib 5.x para a 26.2 (artefato com.geckolib:geckolib-fabric-26.2). 5.5.5 era a mais nova que achei.
geckolib_version=5.5.5

## TACZ (armas de fogo) para a 26.2
# O jar do TACZ nao esta em nenhum maven: fica na pasta libs/ do projeto (veja PORTE-TACZ.md).
tacz_jar=TACZ-Refabricated-26_2-1_1_8_fabric_26_2_R3-hotfix2.jar
# O TACZ 26.2 exige forgeconfigapiport >= 26.2.1 (biblioteca de configuracao). Vem do maven do Fuzs.
forge_config_api_port_version=26.2.1

